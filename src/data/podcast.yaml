# Prof of Concept — Marcel's German-language podcast (launched June 2026).
# "New episode" workflow: add it at the TOP of `episodes` — the homepage
# automatically features episodes[0] as the latest episode.
# Facts sourced from the official RSS feed (anchor.fm), Apple Podcasts and YouTube,
# refreshed 13 August 2026. NOTE: the show rebranded since launch — feed title is now
# "Prof of Concept - So läuft Wirtschaftspolitik.", the focus is economic policy, and
# the feed credits only Christoph Wieland as co-host (Niklas Schwab no longer listed).
name: Prof of Concept
tagline: Wirtschaftspolitik für Hyperformer
# Official show description, verbatim from the podcast feed (German):
description: >-
  Wirtschaftspolitik für Hyperformer. Prof. Dr. Marcel Olbert von der Universität
  Mannheim nimmt die wirtschaftspolitischen Themen von A bis Z auseinander,
  wissenschaftlich fundiert und Facts First. Für die nötige Prise Humor sorgt sein
  Co-Host, der Chief Narration Officer von HYPER: Christoph Wieland. Wie ein
  MBA-Studium in Podcastform, nur unterhaltsamer und ohne Prüfungen. Steuern, Märkte,
  Geld und die große Frage, wie die Politik das alles am besten kontrolliert (oder
  lieber nicht).
# Short English framing for the site's international audience:
blurb: >-
  My German-language podcast on economic policy: together with my co-host Christoph
  Wieland, I take apart the issues from A to Z — scientifically grounded, facts
  first, and with the necessary dose of humor. Like an MBA in podcast form, only
  more entertaining and without the exams.
