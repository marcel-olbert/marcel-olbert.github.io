- date: 2027-02
  text: >-
    Save the date: on 23 February 2027 we publicly launch COBRA, the Mannheim
    Research Center for Corporate Behavior and Regulation Analysis, with an evening
    event in the Aula of the University of Mannheim on the question “Economic
    Miracle 2.0? How much regulation does Germany need amid geopolitical realignment
    and technological disruption?” With Sebastian Matthes (Editor-in-Chief,
    Handelsblatt), Danyal Bayaz (Finance Minister of Baden-Württemberg), Julia
    Stadler (Co-CEO, Stadler Anlagenbau) and Annika Maldener (Managing Director, CVC
    Capital Partners). Held in German; formal invitations follow in the autumn.
  link: /events/
  linkLabel: Programme & speakers

- date: 2026-09
  text: >-
    On 29 September I am moderating the MaFAT annual panel “Germany in Search of
    Growth: What Can Private Equity Contribute?” at the University of Mannheim, with
    Dr. Ralf U. Braunagel (PwC Deutschland) and Cornelius Becker (independent
    investor). 17:30, room SN 163, open to all, held in German.
  link: https://www.bwl.uni-mannheim.de/mafat/httpswwwbwluni-mannheimdenewswir-brauchen-einen-neuen-steuermix/detail/mafat-jahresveranstaltung-deutschland-auf-der-suche-nach-wachstum-2/
  linkLabel: Event details

- date: 2026-09
  text: "Run with your Prof – Tax Run Club 2026: 5 km durch Mannheim mit Christoph Spengel und mir, danach Get-together im Café EO mit DJ Jelly, Freigetränken und Merch. 23. September, 17:30 Uhr, Start am Ehrenhof der Universität Mannheim. Ein Event des MaFAT Student Club, ermöglicht von MaFAT e.V., COBRA und KPMG Mannheim."
  link: /events/
  linkLabel: Events

- date: 2026-08
  text: >-
    Invited speaker at the Stanford Accounting Summer Camp, Stanford Graduate School
    of Business, presenting work on deferred taxes at US banks to around 90
    participants, mostly faculty from leading US universities: how the write-down of
    deferred tax assets following the 2017 Tax Cuts and Jobs Act affected lending to
    mid-sized US firms. The analysis draws on financialfilings.com, a database newly
    acquired by our Accounting and Taxation Area and COBRA, which makes near
    real-time text analysis of listed companies’ reporting possible. Matti
    Boie-Wegener, postdoc in my team, was also invited.
  link: https://financialfilings.com
  linkLabel: financialfilings.com

- date: 2026-07
  text: New open resource — Measuring Tax Effects, an interactive guide to 84+ measures and 51 data sources for tax research, with Rebecca Lester (Stanford GSB). Companion to our Journal of Accounting and Economics review.
  link: https://www.measuringtaxeffects.com/
  linkLabel: measuringtaxeffects.com

